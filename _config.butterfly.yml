# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: onlylo's blog
subtitle: 'only live once'
description: '网站描述'
keywords: 'onlylo 博客'
author: onlylo
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
# 在 _config.yml 开启资源文件夹
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: git@github.com:wm2103/wm2103.github.io.git
  branch: main
# - type: git
#   repository: git@gitee.com:onlyliveonce/onlylo.gitee.io.git
#   branch: master

nav:
  logo: #image
  display_title: true
  fixed: false # fixed navigation bar

menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

social:
  fab fa-github: https://github.com/wm2103 || Github || "#hdhfbb"
  fas fa-envelope: 2504310092@qq.com || Email || "#000000"

# avatar:
#   img: /img/avatar.png
#   effect: true 

# tag 子页面的 top_img，可配置每个 tag 的 top_img
# tag_per_img:
#   aplayer: https://xxxxxx.png
#   android: ddddddd.png

# # 
# category_per_img：
#   隨想: hdhdh.png
#   推薦: ddjdjdjd.png


# A simple 404 page
error_404:
  enable: true
  subtitle: "页面没有找到"
  background: /img/404.png


index_img: https://api.bimg.cc/today #随机必应壁纸

# If the banner of page not setting, it will show the top_img
default_top_img: https://api.aqcoder.cn/random

cover:
  # 是否显示文章封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 封面显示的位置
  # 三个值可配置 left , right , both
  position: both
  # 当文章Front-matter没有设置封面时，默认的封面显示
  default_cover:
    https://api.aqcoder.cn/random
    # - https://i.loli.net/2020/05/01/gkihqEjXxJ5UZ1C.jpg